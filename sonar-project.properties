# ============================================================
#  SONARQUBE PROJECT CONFIGURATION
# ============================================================

# ===== Project identity =====
sonar.projectKey=khatija-mern-10pshine
sonar.projectName=Khatija MERN 10PShine
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8



# ============================================================
#  SCAN SCOPE
# ============================================================

# Include all source code (frontend + backend)
sonar.sources=.

# Exclude build, node_modules, dist, and test artifacts
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/*.config.js,**/*.config.cjs,**/*.config.mjs

# ============================================================
#  TESTS & COVERAGE
# ============================================================

# Mark all test files for Sonar's understanding
sonar.tests=.
sonar.test.inclusions=**/*.test.* , **/*.spec.*

# Coverage reports (generated by Jest and NYC)
# -> Jest creates frontend/coverage/lcov.info
# -> NYC creates backend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# Exclude these from coverage metrics
sonar.coverage.exclusions=**/*.test.* , **/*.spec.* , **/__mocks__/** , **/tests/** , **/*.stories.* , **/vite-env.d.ts

# ============================================================
#  OPTIONAL: ADVANCED SETTINGS
# ============================================================

# Analyze JS/TS only (ignore JSON, CSS, etc.)
sonar.language=js

# Ignore logs & environment files
sonar.exclusions=**/*.log,**/.env,**/env/**,**/coverage/**

# ============================================================
#  END OF FILE
# ============================================================
